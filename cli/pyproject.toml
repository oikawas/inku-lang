[project]
name = "inku-cli"
version = "0.1.0"
description = "Command line client for controlling an inku API server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "inku-analysis",
    "pillow>=12.3.0",
]

[project.scripts]
inku-cli = "inku_cli.cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.ruff.lint]
# Same pin as server/pyproject.toml, and for the same reason: ruff 0.16 widened
# its default rule set from 59 rules to 413, so the version bump alone turned a
# clean tree into 13 findings here with no code change.  Keep the check meaning
# what it meant through 0.15 -- undefined names, unused imports and bindings,
# syntax-level errors -- so a future default change cannot move it again.
select = ["E4", "E7", "E9", "F"]

[tool.uv.sources]
inku-analysis = { path = "../shared", editable = true }
