name: Inku
options:
  minimumXcodeGenVersion: 2.44.0
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
packages:
  InkuApple:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ONLY_ACTIVE_ARCH: NO
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  InkuMac:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources/InkuMac
      - path: Resources/AppIcon.icns
        buildPhase: resources
      # The zoomed windows' program (Apple silicon), built by scripts/build-core.sh.
      - path: scripts/.build/core/display-gpu/inku-display-gpu
        buildPhase:
          copyFiles:
            destination: executables
    dependencies:
      - package: InkuApple
        product: InkuUI
    preBuildScripts:
      # The build script supplies a freshly allocated version and build number.
      - name: Check bundle version
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/VERSION
          - $(SRCROOT)/BUILD_NUMBER
        script: |
          version="$(tr -d '[:space:]' < "$SRCROOT/VERSION")"
          build="$(tr -d '[:space:]' < "$SRCROOT/BUILD_NUMBER")"
          if [ -z "$INKU_ALLOCATED_VERSION" ] || [ "$MARKETING_VERSION" != "$INKU_ALLOCATED_VERSION" ] || \
             ! python3 "$SRCROOT/scripts/allocate-build-number.py" --version-floor "$version" --check-version "$MARKETING_VERSION" || \
             [ -z "$INKU_ALLOCATED_BUILD_NUMBER" ] || \
             [ "$CURRENT_PROJECT_VERSION" != "$INKU_ALLOCATED_BUILD_NUMBER" ] || \
             ! [ "$CURRENT_PROJECT_VERSION" -gt "$build" ] 2>/dev/null; then
              echo "error: use apple/scripts/build-macos.sh to allocate a fresh version and build number"
              exit 1
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.inku.macos
        PRODUCT_NAME: Inku
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Configuration/Info-Mac.plist
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        ARCHS: arm64 x86_64
        ONLY_ACTIVE_ARCH: NO
schemes:
  InkuMac:
    build:
      targets:
        InkuMac: all
