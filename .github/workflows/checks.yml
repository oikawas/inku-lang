name: checks

# The frozen-corpus workflow proves the deterministic layers are stable off one
# Mac. It cannot see a regression the corpora do not cover, so these jobs run
# the suites a human would otherwise have to remember to run (ledger I-192).

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Rust toolchain guard
        run: make rust-toolchain-test
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      # ruff first: seconds against minutes, and it names an undefined symbol
      # that a green suite can still walk past.
      - name: Lint
        working-directory: server
        run: uv run ruff check src tests scripts
      # Two tests compare bytes baked on darwin against a bake made here, so
      # they read a platform difference as a defect (ledger I-111, measured on
      # this runner 2026-08-12). They stay green on the Mac, where the git
      # management session runs the full suite before every merge.
      #   - the Android fixtures under android/app/src/.../server_reference/
      #     differ in render-engine-31/manifest.json and
      #     renderer_variation_primitives.json
      #   - the platform-stability pair test freezes the set of cases that move,
      #     and that set is what changes between the two machines
      # -rs prints the reason for every skip: what does not run here is part of
      # what this backstop cannot see.
      - name: Test
        run: >
          # The two deselects that used to be here compared linux bytes against a
          # darwin bake and read the difference as a defect (ledger I-111, I-222).
          # As of 2026-08-17 the fixture is baked on linux and the platform
          # expectation is recorded per platform, so both run here. Measured the
          # same day in two containers, glibc 2.36 and 2.41: identical bytes and
          # 8 passed in both. If this job goes red on them, the honest fix is to
          # look at which glibc the runner has before deselecting anything again.
          make test-server

  cli:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Lint
        working-directory: cli
        run: uv run ruff check src tests scripts
      - name: Test
        run: make test-cli

  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Types and Svelte
        working-directory: web
        run: npm run check
      - name: Unit tests
        run: make test-web
      # The display strings are Japanese-canonical; this reads the English side
      # against the glossary. It does not look at manual/.
      - name: English display strings
        working-directory: web
        run: npm run lint:i18n

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Bilingual documents
        run: python3 server/scripts/check_docs.py
