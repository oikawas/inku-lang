services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      INKU_ENV: production
      INKU_SESSION_COOKIE_SECURE: ${INKU_SESSION_COOKIE_SECURE:-0}
      INKU_CORS_ORIGINS: ${INKU_CORS_ORIGINS:-}
      INKU_BOOTSTRAP_ADMIN_USERNAME: ${INKU_BOOTSTRAP_ADMIN_USERNAME:-admin}
      INKU_BOOTSTRAP_ADMIN_EMAIL: ${INKU_BOOTSTRAP_ADMIN_EMAIL:-admin@localhost}
      # Required, because the first startup on an empty volume creates the only
      # account there is: inku has no self-service registration.
      INKU_BOOTSTRAP_ADMIN_PASSWORD: ${INKU_BOOTSTRAP_ADMIN_PASSWORD:?set INKU_BOOTSTRAP_ADMIN_PASSWORD (8 characters or more) in the --env-file}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # LLM backend wiring for bench parity with bare metal. Values come from the
      # pentala-local --env-file (never committed). OVMS is reached via the LAN IP
      # set in OPENAI_BASE_URL (container reaches the host's LAN address).
      INKU_LLM_BACKEND: ${INKU_LLM_BACKEND:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_MODEL_STAGE1: ${OPENAI_MODEL_STAGE1:-}
      INKU_SKETCH_RELATIONS: ${INKU_SKETCH_RELATIONS:-}
    ports:
      - "${INKU_API_PORT:-8101}:8100"
    volumes:
      - inku-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      INKU_API_BASE_URL: http://api:8100
      ORIGIN: ${INKU_ORIGIN:-http://localhost:5173}
    ports:
      - "${INKU_WEB_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  inku-data:
