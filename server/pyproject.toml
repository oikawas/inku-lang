[project]
name = "inku-server"
version = "2.7.2"
description = "FastAPI server for inku: interprets descriptions into DDL, composes JSON Scores, and performs them as SVG"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "inku-analysis",
    "anthropic>=0.96.0",
    "fastapi>=0.136.0",
    "openai>=2.32.0",
    "pydantic>=2.13.3",
    "python-dotenv>=1.2.2",
    "cryptography>=46.0.0",
    "sqlalchemy>=2.0.0",
    "svgwrite>=1.4.3",
    "uvicorn[standard]>=0.45.0",
    "pillow>=12.3.0",
]

[project.scripts]
inku-server = "inku_server:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.11",
]

[tool.uv.sources]
inku-analysis = { path = "../shared", editable = true }
