name: Android shared Rust boundary

on:
  pull_request:
    paths:
      - ".github/workflows/android-native.yml"
      - "core/**"
      - "android/app/build.gradle.kts"
      - "android/gradle/**"
      - "android/gradlew"
      - "android/settings.gradle.kts"
      - "android/app/src/main/java/app/inku/mobile/render/**"
      - "android/app/src/main/java/app/inku/mobile/pipeline/**"
      - "android/app/src/main/java/app/inku/mobile/data/InkuRepository.kt"
      - "android/app/src/main/java/app/inku/mobile/HeadlessRenderActivity.kt"
      - "android/app/src/main/java/app/inku/mobile/ui/InkuApp.kt"
      - "android/app/src/test/java/app/inku/mobile/render/**"
      - "android/app/src/androidTest/java/app/inku/mobile/render/**"
      - "server/reference/render-engine-21/G-scatter-edge.svg"
      - "server/reference/render-engine-41/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-native.yml"
      - "core/**"
      - "android/app/build.gradle.kts"
      - "android/gradle/**"
      - "android/gradlew"
      - "android/settings.gradle.kts"
      - "android/app/src/main/java/app/inku/mobile/render/**"
      - "android/app/src/main/java/app/inku/mobile/pipeline/**"
      - "android/app/src/main/java/app/inku/mobile/data/InkuRepository.kt"
      - "android/app/src/main/java/app/inku/mobile/HeadlessRenderActivity.kt"
      - "android/app/src/main/java/app/inku/mobile/ui/InkuApp.kt"
      - "android/app/src/test/java/app/inku/mobile/render/**"
      - "android/app/src/androidTest/java/app/inku/mobile/render/**"
      - "server/reference/render-engine-21/G-scatter-edge.svg"
      - "server/reference/render-engine-41/**"
  workflow_dispatch:

jobs:
  rust-and-android-host:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install pinned Rust and Android target
        run: >-
          rustup toolchain install 1.95.0 --profile minimal
          --component rustfmt --component clippy
          --target aarch64-linux-android
      - name: Install pinned NDK
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865"
      - name: Rust format
        working-directory: core
        run: rustup run 1.95.0 cargo fmt --all -- --check
      - name: Rust tests
        working-directory: core
        run: rustup run 1.95.0 cargo test --locked --workspace
      - name: Rust lint
        working-directory: core
        run: rustup run 1.95.0 cargo-clippy clippy --locked --workspace --all-targets -- -D warnings
      - name: Android arm64 native packaging input
        working-directory: android
        run: ./gradlew :app:checkRustNative
      - name: Android host-boundary JVM tests
        working-directory: android
        run: >-
          ./gradlew :app:testDebugUnitTest
          --tests app.inku.mobile.render.AndroidRenderHostTest
          --tests app.inku.mobile.render.RustArtworkRasterizerTest
          --tests app.inku.mobile.render.WorkColorSnapshotTest
