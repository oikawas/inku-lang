name: Inku
options:
  minimumXcodeGenVersion: 2.44.0
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
packages:
  InkuApple:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ONLY_ACTIVE_ARCH: NO
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  InkuMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/InkuMac
      - path: Resources/AppIcon.icns
        buildPhase: resources
    dependencies:
      - package: InkuApple
        product: InkuUI
    preBuildScripts:
      # apple/VERSION and apple/BUILD_NUMBER are the only bundle version source.
      # The build scripts pass them as settings; a build without them stops here.
      - name: Check bundle version
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/VERSION
          - $(SRCROOT)/BUILD_NUMBER
        script: |
          version="$(tr -d '[:space:]' < "$SRCROOT/VERSION")"
          build="$(tr -d '[:space:]' < "$SRCROOT/BUILD_NUMBER")"
          if [ "$MARKETING_VERSION" != "$version" ] || [ "$CURRENT_PROJECT_VERSION" != "$build" ]; then
              echo "error: pass MARKETING_VERSION=$version CURRENT_PROJECT_VERSION=$build (apple/scripts/build-macos.sh does)"
              exit 1
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.inku.macos
        PRODUCT_NAME: Inku
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Configuration/Info-Mac.plist
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ARCHS: arm64 x86_64
        ONLY_ACTIVE_ARCH: NO
schemes:
  InkuMac:
    build:
      targets:
        InkuMac: all
