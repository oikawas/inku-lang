name: reference-corpus

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  render-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Regenerate current render corpus
        working-directory: server
        run: uv run python scripts/gen_render_reference.py
      - name: Require byte-identical frozen output
        run: |
          git diff --exit-code -- server/reference/
          test -z "$(git status --porcelain --untracked-files=all -- server/reference/)"

  ddl-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Regenerate current DDL corpus
        working-directory: server
        run: uv run python scripts/gen_ddl_reference.py
      - name: Require byte-identical frozen output
        run: |
          git diff --exit-code -- server/reference/
          test -z "$(git status --porcelain --untracked-files=all -- server/reference/)"

  android-design-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Regenerate Android design preview
        run: uv run python android/design/gen_design_preview.py
      - name: Require byte-identical frozen output
        run: |
          git diff --exit-code -- android/design/preview/
          test -z "$(git status --porcelain --untracked-files=all -- android/design/preview/)"
