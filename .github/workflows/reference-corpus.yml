name: reference-corpus

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  render-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Regenerate current render corpus
        working-directory: server
        run: uv run python scripts/gen_render_reference.py
      - name: Require byte-identical frozen output
        run: |
          git diff --exit-code -- server/reference/render-engine-10/
          test -z "$(git status --porcelain --untracked-files=all -- server/reference/render-engine-10/)"

  ddl-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Regenerate current DDL corpus
        working-directory: server
        run: uv run python scripts/gen_ddl_reference.py
      - name: Require byte-identical frozen output
        run: |
          git diff --exit-code -- server/reference/ddl-engine-1/
          test -z "$(git status --porcelain --untracked-files=all -- server/reference/ddl-engine-1/)"
