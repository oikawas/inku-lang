name: release

# Release images are built and published from the maintainer's machine since
# 2026-10-13: building them here took 40-60 minutes. This manual run only
# checks that both images still build for both architectures; it publishes
# nothing.
on:
  workflow_dispatch:

jobs:
  images:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            runner: ubuntu-24.04
            dockerfile: server/Dockerfile
            platforms: linux/amd64
          - name: api
            runner: ubuntu-24.04-arm
            dockerfile: server/Dockerfile
            platforms: linux/arm64
          - name: web
            runner: ubuntu-24.04
            dockerfile: web/Dockerfile
            platforms: linux/amd64,linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU for the Web image
        if: matrix.name == 'web'
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: false
          outputs: type=cacheonly
