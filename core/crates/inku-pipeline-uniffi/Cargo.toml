[package]
name = "inku-pipeline-uniffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "UniFFI byte facade for the host-neutral inku pipeline"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = []
cli = ["uniffi/cli"]

[dependencies]
inku-ddl = { path = "../inku-ddl" }
inku-pipeline = { path = "../inku-pipeline" }
inku-score = { path = "../inku-score" }
inku-render = { path = "../inku-render" }
inku-svg-raster = { path = "../inku-svg-raster" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uniffi = { version = "=0.32.0", default-features = false }
regex = "=1.13.1"
sudachi = { git = "https://github.com/WorksApplications/sudachi.rs.git", rev = "5de0410b6edfd428fc510cc9763440772e9619d5" }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]
