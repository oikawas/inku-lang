[package]
name = "inku-render-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Thin Python binding for the inku render core"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
inku-pipeline-uniffi = { path = "../inku-pipeline-uniffi" }
inku-score.workspace = true
inku-render.workspace = true
inku-svg-raster.workspace = true
pyo3.workspace = true
# The Server's and the CLI's PNG (`svg_to_png`): the vendored resvg, with text for
# the card's headnote from the font files the host passes (no system fonts).
resvg = { workspace = true, features = ["text"] }
serde.workspace = true
serde_json.workspace = true
