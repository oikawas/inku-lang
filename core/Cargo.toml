[workspace]
members = [
    "crates/inku-render",
    "crates/inku-render-python",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
inku-render = { path = "crates/inku-render" }
pyo3 = { version = "=0.29.2", features = ["abi3-py312", "extension-module"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
