[package]
name = "inku-display"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Screen display of inku SVG artifacts with Skia, matching the Web's Chrome"
publish = false

[lib]
path = "src/lib.rs"

[features]
default = []
# Skia is opt-in: CI and the Server build the pure part only. Display hosts
# enable it through `inku-pipeline-uniffi/display`.
skia = ["dep:skia-safe"]

[dependencies]
inku-svg-raster.workspace = true
roxmltree = "=0.21.1"

# Apple's prebuilt binaries keep their CPU-only feature key.
[target.'cfg(not(target_os = "android"))'.dependencies]
skia-safe = { version = "=0.153.3", features = ["svg", "webp"], optional = true }

# Android's published SVG/WebP binary includes Ganesh and Vulkan. DisplayScene
# still uses CPU raster surfaces and never creates a GPU context. no-compile
# refuses a source build if the verified prebuilt cannot be imported.
[target.'cfg(target_os = "android")'.dependencies]
skia-safe = { version = "=0.153.3", features = ["ganesh", "vulkan", "svg", "webp", "no-compile"], optional = true }

[dev-dependencies]
inku-ddl.workspace = true
inku-pipeline.workspace = true
serde_json.workspace = true
jni.workspace = true
png = "=0.18.1"

# Only the instrumentation APK carries this JNI library and the comparison API.
[[example]]
name = "display_check_android"
crate-type = ["cdylib"]
