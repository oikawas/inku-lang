services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      INKU_DEVELOPER_MODE: ${INKU_DEVELOPER_MODE:-1}
      INKU_ENV: production
      INKU_SESSION_COOKIE_SECURE: ${INKU_SESSION_COOKIE_SECURE:-0}
      INKU_CORS_ORIGINS: ${INKU_CORS_ORIGINS:-}
      # A distributed inku belongs to whoever installed it, so it opens without
      # a login screen. The application default is off -- an existing
      # deployment must not lose its login screen by upgrading -- and it is
      # this file, the distribution, that turns it on.
      INKU_SINGLE_USER: ${INKU_SINGLE_USER:-1}
      INKU_BOOTSTRAP_ADMIN_USERNAME: ${INKU_BOOTSTRAP_ADMIN_USERNAME:-admin}
      INKU_BOOTSTRAP_ADMIN_EMAIL: ${INKU_BOOTSTRAP_ADMIN_EMAIL:-admin@localhost}
      # Needed only when INKU_SINGLE_USER is turned off: with a login screen and
      # no self-service registration, an empty volume would have nobody to sign
      # in as. Single-user mode makes its own account instead, and the settings
      # screen asks for a password there. Compose interpolation cannot express
      # "required unless", so this is no longer ${...:?} -- see deploy/.env.example.
      INKU_BOOTSTRAP_ADMIN_PASSWORD: ${INKU_BOOTSTRAP_ADMIN_PASSWORD:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # LLM backend wiring for bench parity with bare metal. Values come from the
      # pentala-local --env-file (never committed).
      INKU_LLM_BACKEND: ${INKU_LLM_BACKEND:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      INKU_SKETCH_RELATIONS: ${INKU_SKETCH_RELATIONS:-}
    ports:
      - "${INKU_API_PORT:-8101}:8100"
    volumes:
      - inku-data:/data
    restart: unless-stopped
    # The default json-file driver keeps every line forever. The application's
    # own retention only covers the files it writes under /data/logs; what the
    # daemon collects from stdout needs its own ceiling (ledger I-167).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      INKU_API_BASE_URL: http://api:8100
      ORIGIN: ${INKU_ORIGIN:-http://localhost:5173}
    ports:
      - "${INKU_WEB_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  inku-data:
