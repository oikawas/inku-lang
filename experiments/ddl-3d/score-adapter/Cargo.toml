[package]
name = "inku-ddl-3d-adapter"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
inku-score = { path = "../../../core/crates/inku-score" }
inku-render = { path = "../../../core/crates/inku-render", features = ["geometry-export"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
sha2 = "=0.11.0"
wasm-bindgen = "=0.2.129"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
