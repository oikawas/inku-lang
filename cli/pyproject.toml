[project]
name = "inku-cli"
version = "0.1.0"
description = "Command line client for controlling an inku API server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "inku-analysis",
    "cairosvg>=2.7.0",
    "pillow>=12.0.0",
]

[project.scripts]
inku-cli = "inku_cli.cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.11",
]

[tool.uv.sources]
inku-analysis = { path = "../shared", editable = true }
