<svg xmlns="http://www.w3.org/2000/svg" width="440" height="240" viewBox="0 0 440 240" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="440" height="240" fill="#ffffff"/>
  <!-- axes -->
  <line x1="20" y1="20" x2="70" y2="20" stroke="#555" marker-end="url(#a)"/>
  <line x1="20" y1="20" x2="20" y2="70" stroke="#555" marker-end="url(#a)"/>
  <text x="76" y="24" fill="#555">x</text><text x="15" y="86" fill="#555">y</text>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#555"/></marker></defs>
  <!-- chord and arc -->
  <line x1="100" y1="170" x2="340" y2="170" stroke="#888" stroke-dasharray="5 4"/>
  <path d="M100 170 A150 150 0 0 1 340 170" fill="none" stroke="#2c3e8f" stroke-width="3"/>
  <!-- sagitta -->
  <line x1="220" y1="170" x2="220" y2="110" stroke="#c0392b" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="228" y="146" fill="#c0392b">sagitta</text>
  <!-- chord label -->
  <line x1="100" y1="196" x2="340" y2="196" stroke="#333" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="200" y="214" fill="#333">chord</text>
  <!-- reference point -->
  <circle cx="220" cy="170" r="5" fill="#c0392b"/>
  <text x="232" y="186" fill="#c0392b">(position_x, position_y)</text>
  <circle cx="100" cy="170" r="3.5" fill="#333"/><circle cx="340" cy="170" r="3.5" fill="#333"/>
</svg>
