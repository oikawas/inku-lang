[workspace]
members = [
    "crates/inku-ddl",
    "crates/inku-display",
    "crates/inku-display-gpu",
    "crates/inku-pipeline",
    "crates/inku-pipeline-uniffi",
    "crates/inku-score",
    "crates/inku-render",
    "crates/inku-render-android",
    "crates/inku-render-python",
    "crates/inku-svg-raster",
]
resolver = "2"
exclude = ["vendor/kurbo", "vendor/resvg", "vendor/svgtypes"]

# kurbo and svgtypes compute with libm in every build, so a stroke, an ellipse
# or a rotation the Compat clip builds has the same bits on every host (I-733,
# 2026-11-07; vendor/kurbo/INKU_PATCHES.md).
[patch.crates-io]
kurbo = { path = "vendor/kurbo" }
svgtypes = { path = "vendor/svgtypes" }

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
inku-ddl = { path = "crates/inku-ddl" }
inku-display = { path = "crates/inku-display" }
inku-pipeline = { path = "crates/inku-pipeline" }
inku-score = { path = "crates/inku-score" }
inku-render = { path = "crates/inku-render" }
inku-svg-raster = { path = "crates/inku-svg-raster" }
jni = "=0.21.1"
libm = { version = "=0.2.16", default-features = false }
pyo3 = { version = "=0.29.2", features = ["abi3-py312", "extension-module"] }
resvg = { version = "=0.48.1", path = "vendor/resvg", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
sha2 = "=0.11.0"
uniffi = { version = "=0.32.0", default-features = false }

# Cross-crate inlining for the drawing and raster loops (I-732 FFI-11,
# 2026-11-07): 1,073 drawings of 5173 works took 7.55 s instead of 9.51 s with
# the same SVG, and the drawing crate's release build 32 s instead of 20 s.
# `panic` stays `unwind`: the bindings catch panics.
[profile.release]
lto = "thin"
codegen-units = 1

# The raster tests draw full-size images; unoptimized, the drawing dependencies
# took half a minute of the Linux test run. They are optimized in test builds
# only. `resvg` names both the vendored renderer and the pinned upstream one.
[profile.test.package.resvg]
opt-level = 3

[profile.test.package.usvg]
opt-level = 3

[profile.test.package.tiny-skia]
opt-level = 3

[profile.test.package.tiny-skia-path]
opt-level = 3
