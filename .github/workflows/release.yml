name: release

# Tag pushes publish both architectures; manual runs build without publishing.
# API uses native runners because emulating arm64 Rust took over 50 minutes.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  images:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            arch: amd64
            runner: ubuntu-24.04
            dockerfile: server/Dockerfile
            platforms: linux/amd64
            cache_scope: inku-api-amd64
          - name: api
            arch: arm64
            runner: ubuntu-24.04-arm
            dockerfile: server/Dockerfile
            platforms: linux/arm64
            cache_scope: inku-api-arm64
          - name: web
            arch: multi
            runner: ubuntu-24.04
            dockerfile: web/Dockerfile
            platforms: linux/amd64,linux/arm64
            cache_scope: inku-web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU for the Web image
        if: matrix.name == 'web'
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/inku-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=inku-${{ matrix.name }}
            org.opencontainers.image.description=inku (DDL) ${{ matrix.name }} service
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: ${{ github.event_name == 'push' && matrix.name == 'web' }}
          outputs: ${{ matrix.name == 'api' && (github.event_name == 'push' && format('type=image,name={0}/{1}/inku-api,push-by-digest=true,name-canonical=true,push=true', env.REGISTRY, github.repository_owner) || 'type=cacheonly') || '' }}
          tags: ${{ matrix.name == 'web' && steps.meta.outputs.tags || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}

      - name: Record API architecture digest
        if: github.event_name == 'push' && matrix.name == 'api'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Share API architecture digest
        if: github.event_name == 'push' && matrix.name == 'api'
        uses: actions/upload-artifact@v4
        with:
          name: digests-api-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  api-manifest:
    if: github.event_name == 'push'
    needs: images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive API tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/inku-api
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Read both API architecture digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-api-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Publish and verify API manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/inku-api
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("$RUNNER_TEMP"/digests/*)
          [[ "${#files[@]}" -eq 2 ]]
          refs=()
          for file in "${files[@]}"; do
            digest="${file##*/}"
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
            [[ "$(cat "$file")" == "sha256:$digest" ]]
            refs+=("$IMAGE@sha256:$digest")
          done
          tags=()
          first_tag=""
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            tags+=(--tag "$tag")
            [[ -n "$first_tag" ]] || first_tag="$tag"
          done <<< "$TAGS"
          [[ -n "$first_tag" ]]
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
          docker buildx imagetools inspect --raw "$first_tag" |
            jq -e '[.manifests[] | select(.platform.os == "linux") | .platform.architecture] | sort == ["amd64", "arm64"]'
